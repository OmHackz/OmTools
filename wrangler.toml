# Cloudflare Pages configuration for OmTools
# Deploy with: wrangler pages deploy dist
#
# Set the AI key as a secret:
#   wrangler pages secret put AI_API_KEY
#
# Optional vars below can be overridden in the dashboard.

name = "omtools"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[vars]
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
